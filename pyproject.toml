[project]
name = "correlators-flow"
version = "0.1.0"
description = ""
authors = [
    {name = "Luis Altenkort"},
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "colorama==0.4.6",
    "rundec==0.6",
    "natsort==8.4.0",
    "beartype==0.21.0",
    "pandas==2.2.2",
    "latqcdtools"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
latqcdtools = { path = "../AnalysisToolbox/", package = true}
